<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StarX 钱包 RPC 测试</title><style>
body{margin:0;background:#f3f5f8;color:#17202a;font:14px Arial}main{max-width:900px;margin:auto;padding:28px 20px}section{background:#fff;border:1px solid #dfe4ea;border-radius:8px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}button{border:0;border-radius:6px;padding:10px;background:#1769e0;color:#fff;cursor:pointer}button.warn{background:#b86b00}button.secondary{background:#566273}.status{display:grid;grid-template-columns:150px 1fr;gap:9px;margin-top:14px}code,input,pre{font-family:Consolas,monospace}code{word-break:break-all}input{width:100%;padding:9px;margin:6px 0 10px;border:1px solid #cbd3dc;border-radius:5px;box-sizing:border-box}label{color:#5b6573}pre{background:#101820;color:#d8e2ed;border-radius:6px;padding:14px;min-height:140px;max-height:330px;overflow:auto;white-space:pre-wrap;word-break:break-word}</style></head><body><main>
<h1>StarX 钱包 RPC 测试</h1><p>通过 <code>window.ethereum</code> 验证外部 DApp 与 StarX 钱包的 RPC 转发。</p>
<section><div class="grid"><button onclick="connect()">连接 / 授权账户</button><button class="secondary" onclick="refresh()">读取账户与链信息</button><button class="secondary" onclick="request('eth_blockNumber')">读取最新区块</button><button class="secondary" onclick="balance()">读取账户余额</button><button class="warn" onclick="switchChain()">请求切换 StarX 链</button></div><div class="status"><strong>Provider</strong><code id="provider">检测中...</code><strong>账户</strong><code id="account">未连接</code><strong>Chain ID</strong><code id="chain">未知</code></div></section>
<section><h3>签名测试</h3><label>消息</label><input id="message" value="StarX wallet RPC test"><div class="grid"><button onclick="personalSign()">personal_sign</button><button onclick="signTypedData()">eth_signTypedData_v4</button></div></section>
<section><h3>交易测试</h3><p>点击后会调用钱包签名和发送流程，建议使用测试账户。</p><label>接收地址</label><input id="to" placeholder="0x..."><label>金额（wei，可留空）</label><input id="value" placeholder="0"><button class="warn" onclick="sendTransaction()">eth_sendTransaction</button></section><section><h3>请求日志</h3><pre id="log"></pre></section></main><script>
const provider=window.ethereum,logEl=document.getElementById('log');function log(label,value){logEl.textContent=`[${new Date().toLocaleTimeString()}] ${label}\n${JSON.stringify(value,null,2)}\n\n${logEl.textContent}`.slice(0,12000)}async function request(method,params=[]){if(!provider)return log(method,'window.ethereum 不存在');try{const result=await provider.request({method,params});log(method,result);return result}catch(error){log(`${method} 失败`,{code:error.code,message:error.message});throw error}}async function connect(){await request('eth_requestAccounts');await refresh()}async function refresh(){if(!provider)return;document.getElementById('provider').textContent=`StarX=${!!provider.isStarX}, MetaMask兼容=${!!provider.isMetaMask}`;const accounts=await request('eth_accounts'),chain=await request('eth_chainId');document.getElementById('account').textContent=accounts[0]||'未连接';document.getElementById('chain').textContent=`${chain} (${parseInt(chain,16)})`}async function balance(){const accounts=await request('eth_accounts');if(accounts[0])await request('eth_getBalance',[accounts[0],'latest']);else await connect()}async function switchChain(){await request('wallet_switchEthereumChain',[{chainId:'0x1352826'}]);await refresh()}async function personalSign(){const accounts=await request('eth_accounts');if(!accounts[0])return connect();const bytes=new TextEncoder().encode(document.getElementById('message').value),hex=[...bytes].map(n=>n.toString(16).padStart(2,'0')).join('');await request('personal_sign',[`0x${hex}`,accounts[0]])}async function signTypedData(){const accounts=await request('eth_accounts');if(!accounts[0])return connect();const typed={domain:{name:'StarX RPC Test',version:'1',chainId:20260902},message:{text:document.getElementById('message').value},primaryType:'Message',types:{EIP712Domain:[{name:'name',type:'string'},{name:'version',type:'string'},{name:'chainId',type:'uint256'}],Message:[{name:'text',type:'string'}]}};await request('eth_signTypedData_v4',[accounts[0],JSON.stringify(typed)])}async function sendTransaction(){const accounts=await request('eth_accounts');if(!accounts[0])return connect();await request('eth_sendTransaction',[{from:accounts[0],to:document.getElementById('to').value,value:document.getElementById('value').value||'0x0'}])}if(provider){provider.on('accountsChanged',refresh);provider.on('chainChanged',refresh);refresh()}else log('初始化失败','window.ethereum 不存在');</script></body></html>
